name: Bug Report
description: Report a bug or issue with the Govee H6006 BLE integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us diagnose and fix the issue.

        **Before submitting:**
        - Check if a similar issue already exists
        - Enable debug logging to capture detailed logs (see instructions below)

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation Method
      description: How did you install this integration?
      options:
        - HACS (Home Assistant Community Store)
        - Manual installation
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: What version of Home Assistant are you running?
      placeholder: "e.g., 2024.3.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: What version of the Govee H6006 integration are you using?
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device Model
      description: Which Govee device model are you using?
      placeholder: "e.g., H6006"
    validations:
      required: true

  - type: textarea
    id: bluetooth_adapter
    attributes:
      label: Bluetooth Adapter Information
      description: |
        Please provide details about your Bluetooth adapter:
        - Built-in or USB adapter
        - Adapter model/chipset (if known)
        - Host system (e.g., Raspberry Pi 4, Intel NUC, VM)
      placeholder: |
        Built-in Bluetooth on Raspberry Pi 4
        Chipset: Broadcom BCM43455
        Host OS: Home Assistant OS 11.5
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what's happening...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual behavior...
    validations:
      required: true

  - type: textarea
    id: debug_logs
    attributes:
      label: Debug Logs
      description: |
        If available, please provide debug logs. Enable debug logging by adding this to your `configuration.yaml`:
        ```yaml
        logger:
          default: info
          logs:
            custom_components.govee_h6006: debug
            bleak: debug
        ```
        Then restart Home Assistant, reproduce the issue, and copy the relevant logs from Settings → System → Logs.
      placeholder: Paste debug logs here...
      render: shell

  - type: checkboxes
    id: additional_info
    attributes:
      label: Additional Context
      description: Check all that apply
      options:
        - label: This issue occurs consistently (not intermittent)
        - label: I have enabled debug logging and reviewed the logs
        - label: The device works correctly with the official Govee app
        - label: I have tried restarting Home Assistant
        - label: I have tried removing and re-adding the integration

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Information
      description: Add any other context about the problem here (screenshots, configuration snippets, etc.)
      placeholder: Any other relevant information...
