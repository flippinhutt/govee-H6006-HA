[tool.ruff]
# Set the maximum line length to 100 characters
line-length = 100

# Assume Python 3.11 (Home Assistant minimum version)
target-version = "py311"

# Directories and files to exclude from linting
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python syntax)
]

# Allow unused variables when prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# Configure import sorting to match Home Assistant conventions
known-first-party = ["custom_components.govee_h6006"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Allow certain violations in test files
"tests/**/*.py" = [
    "N802",  # Function name should be lowercase (pytest fixtures often use mixed case)
    "N806",  # Variable in function should be lowercase (test data can use uppercase)
]
# Allow certain violations in conftest.py (test stubs)
"tests/conftest.py" = [
    "F401",  # Imported but unused (stubs are imported to patch modules)
    "F811",  # Redefinition of unused name (pytest fixtures)
    "E501",  # Line too long (stubs often have long signatures)
]

[tool.mypy]
# Set Python version to match Home Assistant minimum
python_version = "3.11"

# Enable type checking for core modules
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
check_untyped_defs = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

# Ignore missing imports for dependencies without type stubs
ignore_missing_imports = true
explicit_package_bases = true

# Per-module configuration - apply strict mode to core modules
[[tool.mypy.overrides]]
module = "custom_components.govee_h6006.api"
strict = true

[[tool.mypy.overrides]]
module = "custom_components.govee_h6006.coordinator"
strict = true

# Ignore stubbed test dependencies
[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bleak.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bleak_retry_connector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true
