[pytest]
# Pytest configuration for govee_h6006 integration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts =
    --cov=custom_components.govee_h6006
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    --cov-fail-under=85
    -v

# Coverage omissions
[coverage:run]
omit =
    */tests/*
    */__init__.py
    */conftest.py

[coverage:report]
# Require minimum 85% coverage (fail build if below)
fail_under = 85
precision = 2
show_missing = True
skip_covered = False

# Ignore specific lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
